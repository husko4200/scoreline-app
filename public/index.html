<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScoreLine · Inteligencia Deportiva</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09061C;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #F8FAFC;
    }

    /* Fondo tecnológico con orbes de aurora */
    .sl-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 25%, #1A134A 0%, #09061C 72%);
      z-index: 3;
      transition: opacity .5s cubic-bezier(.2, .8, .2, 1), visibility .5s ease;
    }
    .sl-loader.is-ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .sl-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(139, 92, 246, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, .06) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at 50% 45%, #000 18%, transparent 72%);
      -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 18%, transparent 72%);
      pointer-events: none;
    }
    .sl-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: .42;
      pointer-events: none;
      animation: sl-orb-float 9s ease-in-out infinite alternate;
    }
    .sl-orb-1 {
      width: 360px;
      height: 360px;
      top: -90px;
      left: 18%;
      background: radial-gradient(circle, #6366F1, transparent 70%);
    }
    .sl-orb-2 {
      width: 300px;
      height: 300px;
      bottom: -80px;
      right: 16%;
      background: radial-gradient(circle, #2DD4BF, transparent 70%);
      animation-delay: -4s;
    }
    @keyframes sl-orb-float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(26px, -22px) scale(1.12); }
    }

    /* Tarjeta central limpia y flotante */
    .sl-stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 420px;
      width: 100%;
      animation: sl-in .65s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes sl-in {
      from { opacity: 0; transform: translateY(14px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }

    /* Logo con halo luminoso */
    .sl-logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      padding: 14px 24px;
    }
    .sl-logo-glow {
      position: absolute;
      inset: -12px -18px;
      border-radius: 999px;
      background: radial-gradient(ellipse, rgba(99, 102, 241, .34) 0%, rgba(45, 212, 191, .16) 45%, transparent 72%);
      filter: blur(18px);
      animation: sl-pulse-glow 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes sl-pulse-glow {
      0%, 100% { opacity: .65; transform: scale(.96); }
      50%      { opacity: 1; transform: scale(1.06); }
    }
    .sl-logo {
      position: relative;
      width: min(260px, 68vw);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, .55));
    }

    /* Pill de estado en vivo */
    .sl-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(167, 139, 250, .24);
      backdrop-filter: blur(10px);
      font-size: .74rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #C4B5FD;
    }
    .sl-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2DD4BF;
      box-shadow: 0 0 10px #2DD4BF;
      animation: sl-blink 1.6s ease-in-out infinite;
    }
    @keyframes sl-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .45; transform: scale(.8); }
    }

    /* Barra de progreso fluida */
    .sl-bar-track {
      width: min(260px, 72vw);
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .09);
      overflow: hidden;
      position: relative;
    }
    .sl-bar-fill {
      position: absolute;
      inset: 0;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366F1 0%, #5EEAD4 60%, #818CF8 100%);
      box-shadow: 0 0 12px rgba(94, 234, 212, .55);
      animation: sl-slide 1.5s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    @keyframes sl-slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }

    .sl-msg {
      font-size: .88rem;
      font-weight: 500;
      color: #94A3B8;
      min-height: 1.3em;
      transition: opacity .25s ease;
    }

    /* Botón discreto de reintento local si demora más de 15 s (nunca redirige fuera) */
    .sl-fallback-link {
      margin-top: 6px;
      font-family: inherit;
      font-size: .78rem;
      font-weight: 600;
      color: #A5B4FC;
      background: rgba(165, 180, 252, .08);
      border: 1px solid rgba(165, 180, 252, .25);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease, color .15s ease, background .15s ease;
    }
    .sl-fallback-link.is-visible {
      opacity: .9;
      pointer-events: auto;
    }
    .sl-fallback-link:hover {
      opacity: 1;
      color: #5EEAD4;
      background: rgba(94, 234, 212, .12);
    }

    iframe#sl-app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      z-index: 2;
      background: #09061C;
    }
  </style>
</head>
<body>
  <div class="sl-loader" id="sl-loader">
    <div class="sl-grid" aria-hidden="true"></div>
    <div class="sl-orb sl-orb-1" aria-hidden="true"></div>
    <div class="sl-orb sl-orb-2" aria-hidden="true"></div>

    <div class="sl-stage">
      <div class="sl-logo-wrap">
        <div class="sl-logo-glow" aria-hidden="true"></div>
        <img class="sl-logo" src="/scoreline_logo.png" alt="ScoreLine">
      </div>

      <div class="sl-pill">
        <span class="sl-dot" aria-hidden="true"></span>
        <span>Inteligencia Deportiva</span>
      </div>

      <div class="sl-bar-track" aria-hidden="true">
        <div class="sl-bar-fill"></div>
      </div>

      <p class="sl-msg" id="sl-msg">Conectando con marcadores en vivo…</p>

      <button type="button" class="sl-fallback-link" id="sl-retry">
        ¿Tarda demasiado? Reintentar conexión
      </button>
    </div>
  </div>

  <iframe id="sl-app" title="ScoreLine Analytics" allow="microphone; clipboard-write"></iframe>

  <script>
    var STREAMLIT_APP_URL = "https://scoreline.streamlit.app";

    (function () {
      var frame = document.getElementById("sl-app");
      var loader = document.getElementById("sl-loader");
      var msg = document.getElementById("sl-msg");
      var retryBtn = document.getElementById("sl-retry");

      var pasos = [
        "Conectando con marcadores en vivo…",
        "Sincronizando probabilidades y rachas…",
        "Preparando tu panel de análisis…"
      ];
      var idx = 0;
      var msgTimer = setInterval(function () {
        idx = (idx + 1) % pasos.length;
        msg.style.opacity = "0";
        setTimeout(function () {
          msg.textContent = pasos[idx];
          msg.style.opacity = "1";
        }, 200);
      }, 2400);

      var base = (STREAMLIT_APP_URL || "").replace(/\/+$/, "");
      if (!base || base.indexOf("TU-APP") !== -1) {
        clearInterval(msgTimer);
        frame.style.display = "none";
        msg.textContent = "Falta configurar STREAMLIT_APP_URL en public/index.html.";
        return;
      }

      frame.src = base + "/?embed=true";

      retryBtn.addEventListener("click", function () {
        retryBtn.classList.remove("is-visible");
        msg.textContent = "Reconectando con ScoreLine…";
        frame.src = base + "/?embed=true&_t=" + Date.now();
      });

      function ocultarLoader() {
        clearInterval(msgTimer);
        setTimeout(function () {
          loader.classList.add("is-ready");
        }, 350);
      }

      frame.addEventListener("load", ocultarLoader);

      // Si después de 15 s el iframe aún no respondió, mostrar botón de reintento local
      setTimeout(function () {
        if (!loader.classList.contains("is-ready")) {
          retryBtn.classList.add("is-visible");
        }
      }, 15000);
    })();
  </script>
</body>
</html>
